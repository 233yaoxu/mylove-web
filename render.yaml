# Upload the clean rencontre-server.zip alongside this file in the GitHub repo.
# One process is required: WebSocket fan-out and AI leases are process-local.
services:
  - type: web
    name: mylove-rencontre
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m zipfile -e rencontre-server.zip backend && pip install -r backend/server/requirements-cloud.txt
    startCommand: cd backend && python -m server --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: RENCONTRE_ORIGINS
        value: https://233yaoxu.github.io
      - key: RENCONTRE_TURSO_URL
        sync: false
      - key: RENCONTRE_TURSO_AUTH_TOKEN
        sync: false
