name: Deploy mylove 2.6.2 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble exact verified website
        run: |
          set -euo pipefail
          cat site.zip.001 site.zip.002 > /tmp/site.zip
          echo 'a6662ceedf014c72757b24a1bbb1231f8546a034865687981dfc8aaaef460093  /tmp/site.zip' | sha256sum --check --strict
          mkdir _site
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
          touch _site/.nojekyll
      - name: Require exact 2.6.2 app update manifest
        run: |
          set -euo pipefail
          test -f updates/latest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          expected = {'schemaVersion': 1, 'versionName': '2.6.2', 'versionCode': 170,
              'packageName': 'com.example.app', 'sha256': '203baf4d00f8192468889a44d4588feda71ba7ad618482f0773ff04ace47a3fc', 'size': 57676004,
              'downloadUrl': 'https://github.com/233yaoxu/mylove-web/releases/download/v2.6.2/mylove-2.6.2.apk'}
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit('Refuse wrong app-update field: ' + key)
          PY
          mkdir -p _site/updates
          cp updates/latest.json _site/updates/latest.json
      - name: Publish verified Android download and share page
        run: |
          set -euo pipefail
          mkdir -p _site/download _site/downloads/v2.6.2
          cp download/index.html _site/download/index.html
          apk='_site/downloads/v2.6.2/mylove-2.6.2.apk'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            --proto '=https' --proto-redir '=https' \
            --output "$apk" \
            'https://github.com/233yaoxu/mylove-web/releases/download/v2.6.2/mylove-2.6.2.apk'
          test "$(stat --format=%s "$apk")" = '57676004'
          echo "203baf4d00f8192468889a44d4588feda71ba7ad618482f0773ff04ace47a3fc  $apk" | sha256sum --check --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
