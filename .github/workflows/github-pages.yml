name: Deploy mylove 2.6.0 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble exact verified website
        run: |
          set -euo pipefail
          cat site.zip.001 site.zip.002 > /tmp/site.zip
          echo '53448efdefdfb8f54f3f04b098e96768401fbdc7da97f7d6cc38bafb71d06f06  /tmp/site.zip' | sha256sum --check --strict
          mkdir _site
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
          touch _site/.nojekyll
      - name: Require exact 2.6.0 app update manifest
        run: |
          set -euo pipefail
          test -f updates/latest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          expected = {'schemaVersion': 1, 'versionName': '2.6.0', 'versionCode': 168,
              'packageName': 'com.example.app', 'sha256': 'fa0696d7c6a3480a2e9008d4cdbcfc0217c2ca2faf12115a75d3a798c35ffce4', 'size': 57680242,
              'downloadUrl': 'https://github.com/233yaoxu/mylove-web/releases/download/v2.6.0/mylove-2.6.0.apk'}
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit('Refuse wrong app-update field: ' + key)
          PY
          mkdir -p _site/updates
          cp updates/latest.json _site/updates/latest.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
