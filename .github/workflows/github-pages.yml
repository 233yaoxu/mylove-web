name: Deploy mylove to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble website
        run: |
          cat site.zip.001 site.zip.002 > /tmp/site.zip
          echo 'af7e8e65889067c538c708c5d6ca6185fc53c0544d8c247e55284ca4150141ce  /tmp/site.zip' | sha256sum --check --strict
          mkdir -p _site
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
          test -f _site/.nojekyll
      - name: Add app update manifest
        run: |
          if [ -f updates/latest.json ]; then
            python3 -m json.tool updates/latest.json > /dev/null
            mkdir -p _site/updates
            cp updates/latest.json _site/updates/latest.json
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
