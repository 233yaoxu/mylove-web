name: Deploy mylove 2.5.16 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble exact verified website
        run: |
          set -euo pipefail
          cat site.zip.001 site.zip.002 > /tmp/site.zip
          echo 'bdc31fedf00792ba233a8cadd68206f4441da24607541a45971dceb6d02f40c0  /tmp/site.zip' | sha256sum --check --strict
          mkdir _site
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
          touch _site/.nojekyll
      - name: Require exact 2.5.16 app update manifest
        run: |
          set -euo pipefail
          test -f updates/latest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          expected = {'schemaVersion': 1, 'versionName': '2.5.16', 'versionCode': 151,
              'packageName': 'com.example.app', 'sha256': 'b0e0ff132f0c3c60bdbfc25ab5fe086e7ccf2483d467229ea860ab13995c36b2', 'size': 55605337,
              'downloadUrl': 'https://github.com/233yaoxu/mylove-web/releases/download/v2.5.16/mylove-2.5.16.apk'}
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit('Refuse wrong app-update field: ' + key)
          PY
          mkdir -p _site/updates
          cp updates/latest.json _site/updates/latest.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
